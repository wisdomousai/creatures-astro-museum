# The demo on GitHub Pages: the starter, at /<repo>/, exactly as it is in starter/ with
# only its address set.
name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          (cd starter && BASE="/$repo/" npx astro build)
          cp -R starter/dist _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
